name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Node 24 für alle JS-Actions erzwingen (Default ab Juni 2026 — wir gehen voran).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: ./scripts
          severity: warning

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config (Syntax-Check)
        run: docker compose -f npm/docker-compose.yml config --quiet
