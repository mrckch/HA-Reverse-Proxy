# /etc/nginx/sites-available/example-service.conf
#
# Diese Datei ist eine Vorlage. Beim Anlegen eines neuen Services:
#   1. Kopiere diese Datei nach sites-available/<servicename>.conf
#   2. Ersetze "example.com" durch die echte Domain
#   3. Ersetze "10.0.0.50:3000" durch das echte Backend
#   4. Symlink in sites-enabled/ anlegen (nginx_reload-Script macht das)
#   5. Zertifikat anfordern (siehe scripts/cert-request.sh)

# === HTTP → HTTPS Redirect ===
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    include /etc/nginx/snippets/acme-challenge.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

# === HTTPS ===
server {
    # HTTP/2 als 'listen'-Parameter (alte Form) — kompatibel mit nginx 1.18+,
    # also Ubuntu 24.04 (CI: 1.24) und Debian 13 (1.26). Die seit nginx 1.25
    # eingeführte Form 'http2 on;' ist hübscher, aber inkompatibel mit 1.24.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com www.example.com;

    # Zertifikat (wird von certbot verwaltet)
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/example.com/chain.pem;

    # Logging pro Service (für Statistiken/Debug)
    access_log /var/log/nginx/example-access.log main;
    error_log  /var/log/nginx/example-error.log warn;

    # Connection-Limit pro IP
    limit_conn conn_per_ip 50;

    location / {
        # Allgemeines Rate-Limit, mit Burst
        limit_req zone=general burst=50 nodelay;

        proxy_pass http://10.0.0.50:3000;
        include /etc/nginx/snippets/proxy-defaults.conf;
    }

    # Beispiel: Login-Endpoint mit strengem Rate-Limit
    # location /login {
    #     limit_req zone=auth burst=3 nodelay;
    #     proxy_pass http://10.0.0.50:3000;
    #     include /etc/nginx/snippets/proxy-defaults.conf;
    # }

    # Beispiel: WebSocket-Endpoint
    # location /ws {
    #     proxy_pass http://10.0.0.50:3000;
    #     include /etc/nginx/snippets/proxy-defaults.conf;
    #     include /etc/nginx/snippets/websocket.conf;
    # }
}
