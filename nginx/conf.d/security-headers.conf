# /etc/nginx/conf.d/security-headers.conf
# Wird global eingebunden — pro Site mit add_header... always; ergänzbar

# HSTS — erst aktivieren wenn alle Subdomains sicher per HTTPS laufen
# add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header Strict-Transport-Security "max-age=31536000" always;

# Schutz vor MIME-Sniffing
add_header X-Content-Type-Options "nosniff" always;

# Schutz vor Clickjacking
add_header X-Frame-Options "SAMEORIGIN" always;

# Referrer-Policy
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Permissions-Policy (vorher Feature-Policy)
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# Cross-Origin-Policies (für moderne Apps)
# add_header Cross-Origin-Opener-Policy "same-origin" always;
# add_header Cross-Origin-Embedder-Policy "require-corp" always;
