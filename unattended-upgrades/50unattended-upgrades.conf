// /etc/apt/apt.conf.d/50unattended-upgrades
// Aktiviert ausschließlich Security-Updates. Keine "all-Updates" — die brechen
// erfahrungsgemäß irgendwann unangekündigt etwas, und wir wollen Reverse-Proxy
// stabil. Manuelles Apt-Upgrade läuft unverändert.

Unattended-Upgrade::Origins-Pattern {
    "origin=Debian,codename=${distro_codename}-security,label=Debian-Security";
    "origin=Debian,codename=${distro_codename},label=Debian";
};

Unattended-Upgrade::Package-Blacklist {
    // Hier Pakete eintragen, die NIE automatisch aktualisiert werden sollen.
    // Beispiel:
    // "nginx";
    // "keepalived";
};

// Mail-Notification nur bei Fehlern — kommt nur an, wenn lokal MTA konfiguriert.
Unattended-Upgrade::Mail "";
Unattended-Upgrade::MailReport "on-change";

// Reboots steuern wir manuell (sonst kann uns ein Auto-Reboot beider Nodes
// gleichzeitig den ganzen Cluster killen).
Unattended-Upgrade::Automatic-Reboot "false";

// Alte Pakete aufräumen
Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
Unattended-Upgrade::Remove-Unused-Dependencies "true";

// Bei dpkg-Konflikten lieber abbrechen als raten
Unattended-Upgrade::MinimalSteps "true";
