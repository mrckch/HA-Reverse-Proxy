# /etc/keepalived/keepalived.conf — MASTER (proxy01)

global_defs {
    router_id PROXY01
    enable_script_security
    script_user root
}

# Health-Check: ist nginx aktiv?
vrrp_script chk_nginx {
    script   "/usr/local/bin/check_nginx.sh"
    interval 2
    weight   -20
    fall     2
    rise     2
}

vrrp_instance VI_1 {
    state           MASTER
    interface       eth0           # ggf. an euer Interface anpassen
    virtual_router_id 51
    priority        100            # MASTER hat HÖHEREN Wert als BACKUP
    advert_int      1

    authentication {
        auth_type PASS
        auth_pass CHANGE_ME_SHARED  # MUSS auf BACKUP identisch sein
    }

    virtual_ipaddress {
        192.168.1.100/24 dev eth0   # Floating-IP — anpassen!
    }

    track_script {
        chk_nginx
    }

    # State-Change-Notification (für Statusseite/Logs)
    notify_master "/usr/local/bin/notify_keepalived.sh MASTER"
    notify_backup "/usr/local/bin/notify_keepalived.sh BACKUP"
    notify_fault  "/usr/local/bin/notify_keepalived.sh FAULT"
}
