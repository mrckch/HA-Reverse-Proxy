# /etc/keepalived/keepalived.conf — BACKUP (proxy02)

global_defs {
    router_id PROXY02
    enable_script_security
    script_user root
}

vrrp_script chk_nginx {
    script   "/usr/local/bin/check_nginx.sh"
    interval 2
    weight   -20
    fall     2
    rise     2
}

vrrp_instance VI_1 {
    state           BACKUP
    interface       eth0
    virtual_router_id 51              # MUSS bei MASTER identisch sein
    priority        90                # NIEDRIGER als MASTER
    advert_int      1

    authentication {
        auth_type PASS
        auth_pass CHANGE_ME_SHARED   # identisch zu MASTER
    }

    virtual_ipaddress {
        192.168.1.100/24 dev eth0
    }

    track_script {
        chk_nginx
    }

    notify_master "/usr/local/bin/notify_keepalived.sh MASTER"
    notify_backup "/usr/local/bin/notify_keepalived.sh BACKUP"
    notify_fault  "/usr/local/bin/notify_keepalived.sh FAULT"
}
